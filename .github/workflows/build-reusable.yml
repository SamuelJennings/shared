name: Reusable Build and Push

on:
  # Called from application repositories via `uses: owner/repo/.github/workflows/...`.
  workflow_call:
    inputs:
      # Full image name, for example: ghcr.io/org/repo
      image_name:
        description: Full container image name including registry host
        required: true
        type: string
      # Main image tag to publish in addition to `latest`.
      image_tag:
        description: Primary image tag
        required: true
        type: string
      # Build context path in the caller repository.
      docker_context:
        description: Docker build context path
        required: false
        default: .
        type: string
      # Dockerfile path in the caller repository.
      dockerfile:
        description: Dockerfile path
        required: false
        default: deploy/Dockerfile
        type: string
      # Registry host used by docker/login-action.
      registry:
        description: Container registry host
        required: false
        default: ghcr.io
        type: string
      # Controls whether to also push the `latest` tag.
      push_latest:
        description: Push latest tag
        required: false
        default: true
        type: boolean

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    # Needed for checkout and package publishing to container registries like GHCR.
    permissions:
      contents: read
      packages: write

    steps:
      # Required to read Dockerfile and application source from caller repo.
      - name: Checkout caller repository
        uses: actions/checkout@v4

      # Enables multi-platform and cached builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticates Docker client to the target registry.
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Build tag list once so downstream steps always receive valid newline-delimited tags.
      - name: Resolve image tags
        id: tags
        run: |
          echo "value=${{ inputs.image_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            echo "value=${{ inputs.image_name }}:latest" >> $GITHUB_OUTPUT
          fi

      # Build and push image with deterministic and rolling tags.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
